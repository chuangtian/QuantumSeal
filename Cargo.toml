[package]
name = "quantumseal"
version = "1.0.1"
edition = "2021"
description = "Post-quantum migration workbench: inventories cryptographic indicators in source/config files, assigns migration priorities, and emits a CryptoBOM. Analysis tooling only — not a cryptographic implementation."
license = "MIT"
repository = "https://github.com/chuangtian/QuantumSeal"
keywords = ["post-quantum", "cbom", "crypto-inventory", "migration", "pqc"]
categories = ["command-line-utilities"]

[[bin]]
name = "quantumseal"
path = "src/main.rs"

[lib]
name = "quantumseal"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
