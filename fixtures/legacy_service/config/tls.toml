# Fixture: TLS/cipher configuration with mixed-risk indicators.
# Illustrative only — not a deployable configuration.

[tls]
min_version = "TLSv1.2"
ciphers = [
  "ECDHE-RSA-AES256-GCM-SHA384",
  "ECDHE-ECDSA-CHACHA20-POLY1305",
  "AES128-SHA",       # weaker legacy suite
]

[ssh]
host_key_algorithms = "ssh-rsa,ecdsa-sha2-nistp256,ssh-ed25519"

[hashing]
password_hash = "sha512"
legacy_checksum = "md5"

[keystore]
path = "/etc/service/keystore.pkcs12"
