name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (build, test, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --verbose
      - name: Test
        run: cargo test --verbose

  viewer:
    name: TypeScript viewer (typecheck, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  demo:
    name: End-to-end demo
    runs-on: ubuntu-latest
    needs: [rust, viewer]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build Rust CLI
        run: cargo build --release
      - name: Build viewer
        run: cd viewer && npm install && npm run build
      - name: Scan fixtures to CryptoBOM
        run: ./target/release/quantumseal scan fixtures/legacy_service --format json --output cbom.json
      - name: Render report via viewer
        run: node viewer/dist/cli.js cbom.json --format markdown --out report.md
      - name: Diff against migrated fixture (expect changes)
        run: ./target/release/quantumseal diff cbom.json --path fixtures/migrated_service
