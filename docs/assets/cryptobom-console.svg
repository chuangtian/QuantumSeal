<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="cbTitle cbDesc" font-family="'Cascadia Code','Consolas',ui-monospace,monospace">
  <title id="cbTitle">CryptoBOM terminal and risk constellation</title>
  <desc id="cbDesc">A mission-console split view: a scrolling quantumseal scan transcript on the left, and a constellation of detected cryptographic components plotted by quantum risk on the right.</desc>
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0620"/>
      <stop offset="100%" stop-color="#03010a"/>
    </linearGradient>
    <linearGradient id="uv2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="920" height="400" fill="url(#deep)"/>
  <rect x="1" y="1" width="918" height="398" fill="none" stroke="#2a1a54" stroke-width="1"/>

  <!-- ===== left: terminal ===== -->
  <g>
    <rect x="20" y="20" width="470" height="360" rx="10" fill="#0a0518" stroke="#3b246b" stroke-width="1.2"/>
    <rect x="20" y="20" width="470" height="30" rx="10" fill="#150a30"/>
    <circle cx="40" cy="35" r="5" fill="#c026d3"/><circle cx="58" cy="35" r="5" fill="#8b5cf6"/><circle cx="76" cy="35" r="5" fill="#22d3ee"/>
    <text x="255" y="39" text-anchor="middle" fill="#8a7bbf" font-size="11">quantumseal: CryptoBOM console</text>

    <g font-size="11.5" fill="#cbb8ff">
      <text x="36" y="74"><tspan fill="#22d3ee">▹</tspan> quantumseal scan fixtures/legacy_service</text>
      <text x="36" y="96" fill="#6a5a94" font-size="10">static analysis of crypto indicators only, not a security audit</text>
      <text x="36" y="120">Files scanned: 2   Components: 13   Occurrences: 30</text>

      <g>
        <text x="36" y="150"><tspan fill="#c026d3" font-weight="700">[ 97] MD5</tspan>  <tspan fill="#ff6ad5">CRITICAL</tspan></text>
        <text x="52" y="166" fill="#8a7bbf" font-size="9.5">risk=critical_deprecated  category=hash  files=2</text>
        <text x="36" y="192"><tspan fill="#c026d3" font-weight="700">[ 93] SHA-1</tspan>  <tspan fill="#ff6ad5">CRITICAL</tspan></text>
        <text x="36" y="220"><tspan fill="#a855f7" font-weight="700">[ 80] RSA</tspan>  <tspan fill="#c9a4ff">HIGH · Shor</tspan></text>
        <text x="52" y="236" fill="#8a7bbf" font-size="9.5">guidance: replace with ML-KEM / ML-DSA (or hybrid)</text>
        <text x="36" y="262"><tspan fill="#a855f7" font-weight="700">[ 77] ECC</tspan>  <tspan fill="#c9a4ff">HIGH · Shor</tspan></text>
        <text x="36" y="290"><tspan fill="#22d3ee" font-weight="700">[ 28] AES-256</tspan>  <tspan fill="#7fe6f0">moderate</tspan></text>
      </g>

      <text x="36" y="330" fill="#5fc8bf">Highest priority band: CRITICAL</text>
      <g>
        <rect x="36" y="344" width="9" height="15" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
        <text x="52" y="357" fill="#8a7bbf" font-size="10">wrote CryptoBOM to cbom.json</text>
      </g>
    </g>
    <!-- scanline sweep -->
    <rect x="20" y="50" width="470" height="22" fill="#22d3ee" opacity="0.05">
      <animate attributeName="y" values="50;358;50" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
