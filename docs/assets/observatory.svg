<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-labelledby="obsTitle obsDesc" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="obsTitle">quantumseal migration observatory</title>
  <desc id="obsDesc">A dark orbital scene where legacy RSA and ECC signals decay along orbits and are re-plotted as post-quantum migration paths. Static analysis only; no cryptography is executed.</desc>
  <defs>
    <radialGradient id="void" cx="30%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#160a2e"/>
      <stop offset="55%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#03010a"/>
    </radialGradient>
    <linearGradient id="uv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lattice" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M17 0V34M0 17H34" stroke="#3b246b" stroke-width="0.6" opacity="0.5"/>
      <circle cx="17" cy="17" r="1.1" fill="#5b3aa6" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="920" height="360" fill="url(#void)"/>
  <rect width="920" height="360" fill="url(#lattice)"/>

  <!-- drifting starfield -->
  <g fill="#c7b8ff">
    <circle cx="120" cy="60" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
