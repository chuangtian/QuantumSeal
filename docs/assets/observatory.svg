<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-labelledby="obsTitle obsDesc" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="obsTitle">quantumseal migration observatory</title>
  <desc id="obsDesc">A dark orbital scene where legacy RSA and ECC signals decay along orbits and are re-plotted as post-quantum migration paths. Static analysis only; no cryptography is executed.</desc>
  <defs>
    <radialGradient id="void" cx="30%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#160a2e"/>
      <stop offset="55%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#03010a"/>
    </radialGradient>
    <linearGradient id="uv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lattice" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M17 0V34M0 17H34" stroke="#3b246b" stroke-width="0.6" opacity="0.5"/>
      <circle cx="17" cy="17" r="1.1" fill="#5b3aa6" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="920" height="360" fill="url(#void)"/>
  <rect width="920" height="360" fill="url(#lattice)"/>

  <!-- drifting starfield -->
  <g fill="#c7b8ff">
    <circle cx="120" cy="60" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="90" r="1" opacity="0.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="300" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="320" r="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title block -->
  <text x="40" y="52" fill="#f2ecff" font-size="30" font-weight="700" letter-spacing="1.5">quantumseal</text>
  <text x="42" y="76" fill="#22d3ee" font-size="13.5" letter-spacing="4" font-weight="600">MIGRATION OBSERVATORY · CRYPTOBOM DOSSIER</text>
  <text x="42" y="96" fill="#8a7bbf" font-size="11" letter-spacing="0.5">static analysis of cryptographic indicators, never executes or breaks crypto</text>

  <!-- central legacy body with decaying orbits -->
  <g transform="translate(300 210)">
    <circle r="30" fill="none" stroke="url(#uv)" stroke-width="2" filter="url(#glow)"/>
    <circle r="30" fill="#1b0f38"/>
    <text y="-2" text-anchor="middle" fill="#e9dfff" font-size="12" font-weight="700">RSA</text>
    <text y="13" text-anchor="middle" fill="#b79cff" font-size="9">ECC · DH</text>

    <!-- three tilted orbits -->
    <g fill="none" stroke="#7c4dd6" stroke-width="1.1" opacity="0.6">
      <ellipse rx="80" ry="34" transform="rotate(-18)"/>
      <ellipse rx="112" ry="46" transform="rotate(22)"/>
      <ellipse rx="140" ry="58" transform="rotate(6)"/>
    </g>

    <!-- legacy signals fading as they orbit -->
    <g filter="url(#glow)">
      <circle r="4.5" fill="#c026d3">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M0,0 m-80,0 a80,34 -18 1,0 160,0 a80,34 -18 1,0 -160,0"/>
        <animate attributeName="opacity" values="1;1;0.15;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.6" fill="#a855f7">
        <animateMotion dur="9.5s" repeatCount="indefinite" rotate="auto" path="M0,0 m-112,0 a112,46 22 1,0 224,0 a112,46 22 1,0 -224,0"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="9.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- migration beam -->
  <g>
    <line x1="446" y1="210" x2="600" y2="210" stroke="url(#aqua)" stroke-width="2.4" stroke-dasharray="9 7" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <polygon points="600,203 616,210 600,217" fill="#22d3ee"/>
    <text x="523" y="198" text-anchor="middle" fill="#7fe6f0" font-size="10" letter-spacing="1.5">MIGRATE</text>
  </g>

